name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # daily: rebuild the /will-it-run pages from fresh data
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_DOWNLOAD_URL: ${{ vars.NEXT_PUBLIC_DOWNLOAD_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Refreshes data/compat-*.json from the database. Without the secrets (forks, or
      # before they are set) or if the export fails, the build uses the committed snapshot.
      - name: Refresh compatibility data
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.COMPAT_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.COMPAT_SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::COMPAT_SUPABASE_URL / COMPAT_SUPABASE_KEY not set; using the committed snapshot"
            exit 0
          fi
          node scripts/export-compat-tiers.mjs && node scripts/build-will-it-run-data.mjs || {
            echo "::warning::Compatibility refresh failed; using the committed snapshot"
            git checkout -- data/
          }

      - name: Build
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: gamenative.app
          enable_jekyll: false
          force_orphan: true # keep one commit on gh-pages; daily rebuilds would otherwise bloat the repo
